hugoblox:
  schema: "2.0"
  identity:
    name: Lorenzo Ortolani
    organization: Lorenzo Ortolani
    type: person
    tagline: "Roboticist · Physical AI & VLA for Humanoids"
    description: "Lorenzo Ortolani — roboticist and co-founder & CTO of TalOS Robotics AI. Building Physical AI and Vision-Language-Action (VLA) policies so humanoid robots learn diverse skills and generalize across industrial tasks."
    social:
      twitter: ""
  theme:
    mode: dark
    pack: default
    colors:
      primary: cyan
      secondary: violet
      neutral: slate
  typography:
    font: sans
    size: md
  layout:
    radius: md
    spacing: comfortable
    avatar_shape: circle
  header:
    enable: true
    style: navbar
    sticky: true
    align: center
    search: true
    theme_toggle: true
  footer:
    style: minimal
    language_switcher: true
  copyright:
    notice: © {year} {name}
  content:
    math:
      enable: false
    toc:
      enable: true
    reading_time:
      enable: true
  search:
    enable: true
