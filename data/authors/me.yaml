experience:
  - role: Co-Founder & CTO — Robotics & ML Engineer
    org: TalOS Robotics AI
    start: 2025-01-01
    end: ""
    summary: |
      - Co-founding an early-stage humanoid & general legged-robotics startup: software that lets operators train, deploy, and interact with robots through human feedback.
      - Advancing Vision-Language-Action (VLA) policies so robots learn a library of skills and select the right one per task, generalizing across diverse industrial jobs.
      - Building an MCP (Model Context Protocol) app that wraps training, deployment, and human-in-the-loop feedback as agent-callable tools — lowering the skill barrier for non-experts.
      - Owning the robotics/ML stack: humanoid simulation (MuJoCo, Isaac Sim), ROS 2 integration, LLM/agent-driven control, and the dashboard tooling around it.
  - role: Perception & Control Engineer — Robotics Software Engineer
    org: AEA — Automation Engineering Association, Politecnico di Milano
    start: 2024-05-01
    end: ""
    summary: |
      - Co-developing an autonomous drone platform for GPS-denied environments.
      - Built an EKF fusing IMU, GPS, barometer, magnetometer, and stereo visual odometry (ORB-SLAM3), deployed on NVIDIA Jetson Orin Nano.
      - Developed an MPC-based path planner (CasADi); validated in Gazebo Harmonic with ROS 2 and deployed on Pixhawk/PX4. Leading bring-up from simulation to real-world flight.
  - role: Robotics Challenge Participant — Leonardo Drone Contest
    org: AIRLab, Politecnico di Milano (Leonardo S.p.A.)
    start: 2025-04-01
    end: 2025-09-01
    summary: |
      - Autonomous navigation of a mobile robot and a drone in environments with known and unknown obstacles, reaching targets while detecting ArUco markers and objects.
      - Implemented planning algorithms via ROS 2 actions for mission-critical tasks; built a YOLO + OpenCV QR/object detector robust to noisy, blurred frames.
      - Supported a PTZ camera system whose decoded payloads feed contextual information to the robot and drone for dynamic task adaptation.

